 supply chain experience, and familiarity/experience with Technology procurement is required. About You Basic Qualifications 8+ years of direct experience in Procurement, Supply Chain, or Sourcing, including demonstrated experience in Technology/IT procurement (e.g., Software/SaaS, hardware, data center, or public cloud categories) — OR 8+ years of combined experience in Procurement, Sourcing, Supply Chain, Business, and/or Finance, together with a bachelor’s degree in supply chain, Business, Engineering, Finance, or a related field Excellent written and verbal communication skills, with a demonstrated ability to build and maintain strong relationships with internal stakeholders and suppliers Other Qualifications Demonstrated Sourcing experience leading RFx’s, conducting supplier management activities, and managing a Sourcing category with a focus on Software/SaaS Demonstrated expertise in end-to-end hardware sourcing and asset management, including backend infrastructure (servers, switches), corporate office environments (A/V, access points), and end-user computing (laptops, managed IT services).· Executing advanced standard Sourcing and Category Management concepts, practices, and procedures· Demonstration of critical thinking, by translating, analyzing and creating solutions from advanced financial modeling and data analysis.· Advanced understanding of contracts and contract management· Advanced at developing and executing negotiation strategies Workday Pay Transparency Statement The annualized base salary ranges for the primary location and any additional locations are listed below. Workday pay ranges vary based on work location. As a part of the total compensation package, this role may be eligible for the Workday Bonus Plan or a role-specific commission/bonus, as well as annual refresh stock grants. Recruiters can share more detail during the hiring process. Each candidate’s compensation offer will be based on multiple factors including, but not limited to, ge
