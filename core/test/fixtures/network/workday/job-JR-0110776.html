, or production operations. System Architecture: 4+ years of experience designing, building, and evolving scalable, distributed microservices architectures. Performance Engineering: Proven track record of diagnosing and resolving complex performance issues, including memory leaks, CPU bottlenecks, and database/IO serialization delays. Profiling &amp; APM Tools: Hands-on experience with profiling, tracing, and APM tools (e.g., Datadog, New Relic, OpenTelemetry, pprof, or CloudWatch) to analyze runtime application behavior. Other Qualifications Experience with observability tools such as Prometheus, Grafana, CloudWatch, OpenTelemetry, Datadog, New Relic, or ELK. Experience with CI/CD and GitOps tools such as Jenkins, Helm, Argo CD, Argo Workflows, or Kustomize. Strong analytical and problem-solving skills, with a proven ability to collaborate effectively with platform, infrasturcture, and product engineering teams. Experience supporting Java-based applications and build tools such as Maven or Gradle. Workday Pay Transparency Statement The annualized base salary ranges for the primary location and any additional locations are listed below. Workday pay ranges vary based on work location. As a part of the total compensation package, this role may be eligible for the Workday Bonus Plan or a role-specific commission/bonus, as well as annual refresh stock grants. Recruiters can share more detail during the hiring process. Each candidate’s compensation offer will be based on multiple factors including, but not limited to, geography, experience, skills, job duties, and business need, among other things. For more information regarding Workday’s comprehensive benefits, please click here. Primary Location: USA.CA.Pleasanton Primary Location Base Pay Range: $176,000 USD - $264,000 USD Additional US Location(s) Base Pay Range: $148,200 USD - $264,000 USD Our Approach to Flexible Work With Flex Work, we’re combining the best of both worlds: in-person time and remote. Our approach e
