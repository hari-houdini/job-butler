 Engineer in Agent Factory, you will drive the end-to-end system design, implementation, and product integration for a core domain of Workday’s next generation of intelligent agents. While our ML Engineers focus on building, training, and optimizing foundational algorithms, your mission is intelligence orchestration and product delivery—connecting the brain to the product. Sitting at the intersection of AI capabilities, enterprise platforms, and human workflows, you will develop and integrate foundational models safely and reliably into functional, production-grade software. You will be hands-on in the design, experimentation, and orchestration of complex agentic workflows, translating cutting-edge AI capabilities into scalable business value. Because these agents interact with sensitive HR and financial data at a global scale, you will be a key contributor to Responsible and Governed AI—implementing strict guardrails for data privacy, predictability, and explainability within your pod. This role requires a balance of domain-level system architecture and rigorous execution, solving critical product constraints like latency, cost, and reliability. About You About You P5, Principal AI Engineer Basic Qualifications 10+ years of professional software engineering experience with deep expertise in distributed systems, cloud computing, and API design, plus 2+ years of dedicated focus building production-grade LLM/agentic systems OR 7+ years of experience specifically within Machine Learning Engineering or AI application development, with 3+ years dedicated to shipping LLM-backed products. 3+ years of hands-on experience integrating large models (LLMs, Foundation Models) and modern AI APIs into user-facing enterprise products. 2+ years of experience designing and scaling complex AI orchestration architectures—including multi-agent frameworks, routing layers, and advanced RAG pipelines. 6+ years of experience optimizing application performance (specifically tackling constraints like API latency and user interaction design), with 2+ years applied to modern LLM constraints (such as token management, cost optimization, and context-window efficiency). 6+ years of proven experience leveraging cloud computing platforms (e.g., AWS, GCP) to deploy highly responsive, scalable systems. P4, Senior AI Engineer Basic Qualifications 8+ years of professional software engineering experience with strong expertise in backend architecture, distributed systems, and API design, plus 1+ years of dedicated focus building production-grade LLM/agentic systems OR 5+ years of experience specifically within Machine Learning Engineering or AI application development, with 2+ years dedicated to shipping LLM-backed products. 2+ years of hands-on experience integrating large models (LLMs, Foundation Models) and modern AI APIs into user-facing enterprise products. 1+ years of experience designing and scaling AI orchestration architectures—including multi-agent frameworks, routing layers, or advanced RAG pipelines. 4+ years of experience optimizing application performance (specifically tackling constraints like API latency and user interaction design), with 1+ years applied to modern LLM constraints (such as token management, cost optimization, and context-window efficiency). 4+ years of proven experience leveraging cloud computing platforms (e.g., AWS, GCP) to deploy highly responsive, scalable systems. Other Qualifications Bachelor’s degree (Master’s preferred) in Computer Science, Software Engineering, or equivalent technical field. Responsible AI Implementation: Strong understanding of how to execute governance, guardrails, security layers, and evaluation mechanisms necessary when deploying autonomous agents over sensitive enterprise HR and financial data. Technical Leadership &amp; Mentorship: Proven track record of technically leading engineering workstreams within a pod, taking ownership of the development lifecycle, and mentoring junior-to-mid level engineers. ime each quarter in the office or in the field with our customers, prospects, and partners (depending on role). This means you'll have the freedom to create a flexible schedule that caters to your business, team, and personal needs, while being intentional to make the most of time spent together. Those in our remote \"home office\" roles also have the opportunity to come together in our offices for important moments that matter. Pursuant to applicable Fair Chance law, Workday will consider for employment qualified applicants with arrest and conviction records. Workday is an Equal Opportunity Employer including individuals with disabilities and protected veterans. Workday is committed to providing reasonable accommodations for qualified individuals during our application process, in order to perform one or more essential functions of their job, as well as regarding the use of AI tools for employment decision-making to any degree. Please see below for more details including how to request an accommodation as a qualified veteran, due to a disability or for religious reasons, or as otherwise provided under applicable law. Workday prohibits taking adverse action against any candidate or employee for reporting a possible violation of this policy, requesting one or more work accommodations, exercising a privacy right, or cooperating in an investigation in accordance with applicable law. Any employee who retaliates against a candidate or employee for doing so may be subject to disciplinary action, up to and including termination of employment, to the fullest extent allowable under applicable law. If you require a reasonable accommodation, you may email accommodations@workday.com, as far in advance as possible. Are you being referred to one of our roles? If so, ask your connection at Workday about our Employee Referral process! At Workday, we value our candidates’ privacy and data security. Workday will never ask candidates to apply to jobs through websites that are not Work
