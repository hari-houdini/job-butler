ive, achieved by fostering an exceptional engineering team dedicated to code quality and innovative design. About the Role As a Senior Software Development Engineer, you will be a technical leader on the team responsible for maintaining and building our pay-related features. This is a hands-on-keyboard role where you will not only build features but also own the design, scalability, and resilience of critical services. You will tackle complex challenges related to how contingent workers are onboarded, managed, and paid, working on key features like Jobs, Worker Provisioning, Contracts, and Integrations. You will be a key voice in our architectural decisions and will guide the team in building robust solutions using our stack: Python (backend), React (frontend), and AWS. About You This role is for an experienced engineer who enjoys solving complex software problems. The ideal candidate is motivated by continuous learning and maintains a high standard for code quality, consistently writing well-designed, testable, and efficient code. As a senior member of the team, this person must be willing to mentor others and share knowledge to help the team grow. Clear communication is essential, particularly the ability to articulate complex technical ideas to different audiences. This role requires the ability to work effectively with ambiguous requirements, breaking down large projects into smaller, deliverable parts. Basic Qualifications 7+ years of professional software development experience. 3+ years of demonstrated ability designing, building, and maintaining RESTful web services. 3+ years of proven experience with relational databases (e.g., PostgreSQL, MySQL). Deep proficiency in Python and experience with at least one Python web framework (e.g., Django, Flask). Strong experience with modern JavaScript frameworks, specifically React.js. Other Qualifications Proficient understanding of code versioning tools (e.g., Git). Experience with Amazon Web Services (AWS) (e.g., EC2, S3, RDS, Lambda). Knowledge of SaaS applications, multi-tenant architectures, and DevOps/CI/CD practices. Experience working in an Agile/Scrum development environment. Workday is proud to be an equal opportunity workplace. Further, pursuant to applicable local ordinances, Workday will consider for employment qualified applicants with arrest and conviction records. You may view the Workday's Pay Transparency Policy, and Equal Employment Opportunity is the Law notice, by clicking on their corresponding links. Workday is committed to providing reasonable accommodations for qualified individuals with disabilities and disabled veterans during our application process. If you need assistance or an accommodation due to a disability, contact us at accommodations@workday.com. Workday Pay Transparency Statement The annualized base salary ranges for the primary location and any additional locations are listed below. Workday pay ranges vary based on work location. As a part of the total compensation package, this role may be eligible for the Workday Bonus Plan or a role-specific commission/bonus, as well as annual refresh stock grants. Recruiters can share more detail during the hiring process. Each candidate’s compensation offer will be based on multiple factors including, but not limited to, geography, experience, skills, job duties, and business need, among other things. For more information regarding Workday’s comprehensive benefits in Canada, please click here. For more information regarding Workday’s comprehensive benefits in the US, please click here. Primary Location: USA.OH.Mason Primary Location Base Pay Range: $148,200 USD - $222,400 USD Additional CAN Location(s) Base Pay Range: $140,000 - $210,000 CAD Our Approach to Flexible Work With Flex Work, we’re combining the best of both worlds: in-person time and remote. Our approach enables our teams to deepen connections, maintain a strong community, and do their best work. We know that flexibility can take shape in ma
