ngineering: We build IDE tooling, prompt templates, .cursorrules configurations, and context-ingestion pipelines that allow AI-assisted editors (like Cursor) to natively generate compliant Model Context Protocol (MCP) schemas on the first try. How we work: Close end-to-end collaboration across domain experts, AI platform engineers, and site reliability teams to transform domain knowledge into trustworthy, production-ready AI skills. About the Role We are seeking an Applied AI Engineer to serve as a high-impact bridge between human domain expertise and production AI execution. In this role, you will own the end-to-end authoring, prompt architecture, and API integration of AI skills that power Workday's core agentic capabilities. This is a pivotal, high-visibility engineering position with cross-organizational impact. You will work directly with top Subject Matter Experts across business units to translate complex enterprise logic, tribal configuration knowledge, and standard operating procedures into deterministic, schema-compliant AI tools using state-of-the-art AI-assisted development environments. Key Responsibilities Enterprise Skill Authoring &amp; Domain Codification: Partner directly with domain experts and senior consultants across business units to translate complex business logic, prose, and raw scripts into optimal, structured AI skill definitions. AI-Assisted Editor Mastery: Operate at the cutting edge of AI-driven software development (using Cursor, Claude Code, and custom tooling) to rapidly generate, refactor, and refine prompt logic, tool descriptions, and Model Context Protocol (MCP) tool calls. API &amp; Capability Orchestration: Connect skills to backend systems by wiring up enterprise REST APIs, MCP servers, and complex data structures for seamless agent execution. Logic Optimization &amp; Deduplication: Abstract messy business procedures into clean, modular logic—separating prose from executable code while optimizing prompt structures for minimal token consumption and maximum execution reliability. Edge-Case Stress Testing: Design and implement automated test suites to stress-test skill edge cases, API parameter bounds, fallback logic, and error-handling routines before deployment. Enablement &amp; Code Review: Scale authoring standards across Workday by establishing best practices, training domain experts on self-serve authoring workflows, and reviewing submitted skill pull requests for schema compliance and API integrity. Enforce Evaluation-Driven Development (EDD): Partner with Domain Experts to curate benchmark eval datasets, implementing LLM-as-a-Judge scoring, trajectory trace analysis, and CI/CD quality gates to validate skill accuracy and prevent regressions prior to production promotion. Production Telemetry &amp; Drift Analysis: Establish feedback loops using production agent trace logs to identify trajectory failures, update eval benchmark suites, and continuously improve skill deterministic behavior. About You Basic Qualifications 8+ years of professional software engineering experience in Python or TypeScript with a focus on API integrations, backend services, or scripting. 1+ years of hands-on experience leveraging AI-assisted development tools (e.g., Cursor, GitHub Copilot, Claude Code) to author, refactor, and debug production code. Strong experience working with REST APIs, JSON/YAML schemas, and structured data transformations. Bachelor's degree in Computer Science, Engineering, or a related field, or equivalent practical experience. Other Qualifications Strong technical communication and interpersonal skills to collaborate effectively with non-technical domain experts and translate requirements into clean technical specs. Generative AI &amp; Tool Calling: Solid grasp of prompt engineering, function calling, structured outputs, and agentic specifications (e.g., Model Context Protocol / MCP). Code Refactoring &amp; Systems Rigor: Ability to dissect complex domain scripts or unstructured documentation and refactor them into modular, testable, production-ready code. Testing &amp; Quality Mindset: Experience writing unit/integration test cases, mocking API dependencies, and debugging schema mismatches.Basic Qualification Workday Pay Transparency Statement (For EU Locations Only) Listed below is the base salary range applicable to this position. Workday pay ranges (and the precise pay offered to the successful candidate) are based on a number of objective criteria such as relevant experience and skills, and educational qualifications, level of responsibility, demands of the role, work location and business need. As a part of the total compensation package, this role may be eligible for the Workday Bonus Plan or a role-specific commission/bonus, as well as annual refresh stock grants awarded by Workday Inc. For more information regarding Workday’s comprehensive benefits, please click here. Primary Location Base Pay Range: €96,000 EUR - €144,000 EUR Ireland Our Approach to Flexible Work With Flex Work, we’re combining the best of both worlds: in-person time and remote. Our approach enables our teams to deepen connections, maintain a strong community, and do their best work. We know that flexibility can take shape in many ways, so rather than a number of required days in-office each week, we simply spend at least half (50%) of our time each quarter in the office or in the field with our customers, prospects, and partners (depending on role). This means you'll have the freedom to create a flexible schedule that caters to your business, team, and personal needs, while being intentional to make the most of time spent together. Those in our remote \"home office\" roles also have the opportunity to come together in our offices for important moments that matter. Pursuant to applicable Fair Chance law, Workday will consider for employment qualified applicants with arrest and conviction records. Workday is an Equal Opportunity Employer including individuals with disa
