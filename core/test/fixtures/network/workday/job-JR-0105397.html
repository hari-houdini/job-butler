er or Node.js). 3+ years in a technical leadership role (Tech Lead / Lead Engineer) leading complex initiatives end-to-end (delivering 3+ multi-quarter projects) and setting architectural direction. 3+ years of direct operational ownership for critical, customer-facing production services (99.9%+ availability), including active on-call rotation participation and SLA/SLO-driven performance management (p95/p99 latency, MTTR). Basic Qualifications (P3 SDE): 5+ years of professional software engineering experience building, testing, and deploying enterprise-level applications as part of an agile software engineering team. 3+ years of production backend development experience using Java or Kotlin (via Spring Boot or similar JVM frameworks) and 2+ years using TypeScript (browser or Node.js). 2+ years of experience leading technical feature delivery end-to-end—delivering at least 2 multi-month projects from technical design through production deployment. 2+ years of direct operational ownership for customer-facing production services (99.5%+ availability), including active participation in an on-call rotation and working within defined SLAs/SLOs. Other Qualifications: Experience on an Operations or DevOps team is a plus. Bachelor's/Master's in Computer Science, Engineering, or related field; or equivalent professional experience. 3+ years of hands-on experience with containerization, orchestration, and automated pipelines using Docker, Kubernetes, Gradle, and enterprise CI/CD systems. Demonstrated track record of technical communication, including authoring or reviewing 10+ production-grade artifacts (e.g., System Design Docs, Architecture Decision Records [ADRs], or Disaster Recovery Runbooks). Experience formalizing engineering best practices, driving design reviews, and directly mentoring 3+ mid/junior engineers. Experience managing production systems against strict error budgets and automated incident post-mortem workflows. Knowledge of Workday XpressO and Internal Code Lifecycle Development in Workday is a plus. Experience developing distributed and concurrent systems; secure, fault tolerant, highly available, recoverable, consistent, scalable, and predictable and the tradeoffs therein Strong focus on performance, scalability, and security of services. Experienced in collaborating with diverse teams in a fast-paced, Scrum-based environment. Proven troubleshooting and triaging skills to resolve escalated production and customer issues. Skilled in turning ambiguous problems into clear solutions. Able to balance priorities and communicate cross-functionally. Strong written and verbal communication with technical and non-technical audiences. Familiarity with multiple programming languages and paradigms is a plus. Preferred DoD 8570/8140 compliant with at least IAT Level II certification, including a current Computing Environment (CE) credential and one approved specialty certification (e.g., CompTIA CySA+, GICSP, CASP+) Workday Pay Transparency Statement The annualized base salary ranges for the primary location and any additional locations are listed below. Workday pay ranges vary based on work location. As a part of the total compensation package, this role may be eligible for the Workday Bonus Plan or a role-specific commission/bonus, as well as annual refresh stock grants. Recruiters can share more detail during the hiring process. Each candidate’s compensation offer will be based on multiple factors including, but not limited to, geography, experience, skills, job duties, and business need, among other things. For more information regarding Workday’s comprehensive benefits, please click here. Primary Location: USA.VA.Reston Primary Location Base Pay Range: $163,800 USD - $245,800 USD Additional US Location(s) Base Pay Range: $148,200 USD - $264,000 USD Our Approach to Flexible Work With Flex Work, we’re combining the best of both worlds: in-person time and remote. Our approach enables our teams to deepen connections, maintain a
