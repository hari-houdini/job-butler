name: audit

# Fails when a dependency in package-lock.json has a high or critical npm advisory. It runs on
# every pull request and push to main, and weekly, because advisories are published for code that
# hasn't changed. Moderate and low advisories are reported in the log but don't fail the run.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

# Least privilege: the audit only reads the repository.
permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      # Credentials are not kept in the checkout: nothing after it needs to push.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
