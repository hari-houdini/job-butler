name: check

# The same gate as `npm run check` (typecheck, lint, conflict-marker check, tests), on Node 26.
# The gate runs as parallel jobs: the static checks in one, the tests split across three shards
# (`node --test --test-shard`). When a step is added to `npm run check`, add it here too.
# The real-browser Apply tests need Chromium: it is cached between runs, and CI is set on GitHub,
# so a missing browser fails the run rather than skipping its tests (core/test/harness.ts).
#
# Runs on pushes to main and on pull requests. Pushing a pull request's branch runs once, not twice.
on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the check only reads the repository.
permissions:
  contents: read

# A newer push to the same ref cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history, so a pull request's commits can be linted against its base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check:markers
      # Every commit in a pull request must be Conventional Commits (the local commit-msg hook can be skipped).
      - name: Lint pull request commit messages
        if: github.event_name == 'pull_request'
        run: npx --no -- commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"
          cache: npm
      # Read the pinned playwright-core version from package.json, so the browser cache key
      # changes when Playwright is upgraded. This runs before `npm ci`.
      - name: Read the playwright-core version
        id: playwright
        run: |
          echo "version=$(node -p "require('./package.json').devDependencies['playwright-core']")" >> "$GITHUB_OUTPUT"
      # Playwright's default browser directory on Linux is ~/.cache/ms-playwright.
      # This cache must restore before the install step below.
      - name: Cache the Chromium download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-playwright-core-${{ steps.playwright.outputs.version }}
      - run: npm ci
      # Installs the system libraries (--with-deps) every run. Chromium itself is a no-op
      # when the cache restored it.
      - run: npx playwright-core install --with-deps chromium
      # Ubuntu 24.04+ runners restrict unprivileged user namespaces through AppArmor. Without this,
      # the headless Chromium the real-browser tests start can't set up its sandbox, exits before it
      # opens its DevTools port, and every real-browser test fails. Only the CI runner is changed.
      - name: Let Chromium's sandbox start on the runner
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      # Each shard runs a third of the test files. The three together are the whole suite.
      # `npm test -- --test-shard=N/3` does not shard: npm appends the flag after the file glob, where
      # Node ignores it, so every shard ran the whole suite. The shard flag must come before the glob.
      - name: Run the tests (shard ${{ matrix.shard }} of 3)
        run: node --test --test-reporter=dot --test-shard=${{ matrix.shard }}/3 "core/test/**/*.test.ts"
